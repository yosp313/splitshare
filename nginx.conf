# SplitShare reverse proxy: nginx terminates HTTP, gzips text, and forwards
# everything (static + /api + SSE) to the node app, which serves dist/ itself.
# The app reads the real client IP from X-Forwarded-For for rate limiting.

worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /var/log/nginx/access.log;
  error_log /var/log/nginx/error.log warn;

  sendfile on;
  keepalive_timeout 65;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/plain text/css text/javascript application/javascript
    application/json application/manifest+json image/svg+xml;

  upstream app {
    server app:3001 max_fails=3 fail_timeout=10s;
    keepalive 16;
  }

  server {
    listen 80;
    server_name _;

    # Matches the sync server's 50KB body cap, with headroom for headers.
    client_max_body_size 64k;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy no-referrer always;

    location = /healthz {
      access_log off;
      proxy_pass http://app;
      proxy_set_header Host $host;
    }

    location /api/ {
      proxy_pass http://app;
      proxy_http_version 1.1;
      # SSE rooms stream: never buffer, never time out the table.
      proxy_buffering off;
      proxy_read_timeout 1h;
      proxy_send_timeout 1h;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
      proxy_pass http://app;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }

  # TLS: terminate above this file (Caddy, host reverse proxy, or Render).
  # If nginx should do it, mount certs at /etc/nginx/certs and add:
  #   server {
  #     listen 443 ssl;
  #     ssl_certificate /etc/nginx/certs/fullchain.pem;
  #     ssl_certificate_key /etc/nginx/certs/privkey.pem;
  #     ...same locations as above...
  #   }
}
