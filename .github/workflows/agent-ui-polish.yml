# Agent UI Polish - iterated skill loop
#
# This workflow has two modes:
# 1. manual mode: create a fresh agent branch, run the agent, and open a PR.
# 2. /iterate mode: when a maintainer comments on an agent-created PR, update that PR
#    and optionally update .github/agent-memory/ui-polish.md for future runs.
#
# The /iterate path intentionally checks the PR body marker BEFORE checkout/setup so
# every agent workflow can listen for /iterate while non-matching workflows no-op cheaply.

name: "Agent: UI Polish"

on:
  workflow_dispatch:
  issue_comment:
    types: [created] # for iteration!

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: agent-ui-polish
  cancel-in-progress: true

jobs:
  agent-task:
    # Run all non-comment events. For issue comments, only authorized PR comments
    # starting with /iterate are allowed to reach the marker preflight below.
    if: |
      github.event_name != 'issue_comment' ||
      (
        github.event.issue.pull_request &&
        startsWith(github.event.comment.body, '/iterate') &&
        (github.event.comment.author_association == 'OWNER' ||
         github.event.comment.author_association == 'MEMBER' ||
         github.event.comment.author_association == 'COLLABORATOR')
      )
    runs-on: ubuntu-latest
    steps:
      - name: Check iterate marker to bound work-in-progress
        id: agent_gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_URL: ${{ github.event.issue.pull_request.url }}
          WORKFLOW_ID: agent-ui-polish
          AGENT_LABEL: agent-ui-polish
        run: |
          # Scheduled runs no-op when an open PR already exists for this agent.
          if [ "$EVENT_NAME" = "schedule" ] || [ "$EVENT_NAME" = "workflow_call" ]; then
            EXISTING_PR=$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --label "$AGENT_LABEL" --json number,url --limit 1)
            if [ "$(echo "$EXISTING_PR" | jq 'length')" -gt 0 ]; then
              echo "run_agent=false" >> "$GITHUB_OUTPUT"
              echo "Open PR already exists for $AGENT_LABEL; no-op."
              exit 0
            fi
          fi

          # Manual runs are normal agent runs, so allow the rest of the job.
          if [ "$EVENT_NAME" != "issue_comment" ]; then
            echo "run_agent=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # /iterate comments are shared by all recurring agent workflows. The hidden
          # PR body marker deterministically routes the comment to the workflow that
          # originally opened the PR. Non-matching workflows exit before checkout/setup.
          PR_DATA=$(gh api "$PR_URL")
          BODY=$(echo "$PR_DATA" | jq -r '.body // ""')
          if grep -Fq "<!-- codelayer-agent:workflow=$WORKFLOW_ID;" <<< "$BODY"; then
            echo "run_agent=true" >> "$GITHUB_OUTPUT"
            echo "number=$(echo "$PR_DATA" | jq -r '.number')" >> "$GITHUB_OUTPUT"
            echo "head_ref=$(echo "$PR_DATA" | jq -r '.head.ref')" >> "$GITHUB_OUTPUT"
            echo "head_sha=$(echo "$PR_DATA" | jq -r '.head.sha')" >> "$GITHUB_OUTPUT"
          else
            echo "run_agent=false" >> "$GITHUB_OUTPUT"
            echo "PR was not created by $WORKFLOW_ID; no-op."
          fi

      - uses: actions/checkout@v5
        if: steps.agent_gate.outputs.run_agent == 'true' && github.event_name != 'issue_comment'
        with:
          fetch-depth: 0

      - uses: actions/checkout@v5
        if: steps.agent_gate.outputs.run_agent == 'true' && github.event_name == 'issue_comment'
        with:
          # Iteration updates the existing agent PR branch rather than creating a new one.
          ref: ${{ steps.agent_gate.outputs.head_ref }}
          fetch-depth: 0

      - name: Configure git user & branch
        if: steps.agent_gate.outputs.run_agent == 'true'
        shell: bash
        run: |
          if [ "${{ github.event_name }}" != "issue_comment" ]; then
            BRANCH="ui-polish/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
            echo "BRANCH=$BRANCH" >> "$GITHUB_ENV"
            git checkout -b "$BRANCH"
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Install bun
        if: steps.agent_gate.outputs.run_agent == 'true'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install Node.js
        if: steps.agent_gate.outputs.run_agent == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Cache bun dependencies
        if: steps.agent_gate.outputs.run_agent == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install dependencies
        if: steps.agent_gate.outputs.run_agent == 'true'
        run: bun install --frozen-lockfile

      - name: Run coding agent
        if: steps.agent_gate.outputs.run_agent == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE_COLOR: "3"
          TARGET_PATH: ${{ github.event.inputs.target_path }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ steps.agent_gate.outputs.number }}
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          set -o pipefail

          MEMORY_CONTENT="$(cat .github/agent-memory/ui-polish.md)"

          if [ "${{ github.event_name }}" = "issue_comment" ]; then
            # Build an iteration-specific prompt from PR body, comments, review comments,
            # the triggering /iterate feedback, and the current workflow memory file.
            bun .github/scripts/agent-iteration.ts \
              --command prompt \
              --workflow agent-ui-polish \
              --memory .github/agent-memory/ui-polish.md \
              --repo "$GITHUB_REPOSITORY" \
              --pr-number "$PR_NUMBER" \
              --comment-body "$COMMENT_BODY" > /tmp/codelayer-prompt.md

            claude -p "$(cat /tmp/codelayer-prompt.md)" \
              --permission-mode bypassPermissions \
              --output-format stream-json \
              --verbose \
              2>&1 | tee /tmp/agent-output.txt

            # Extract the last assistant text message from stream-json output
            cat /tmp/agent-output.txt \
              | grep '^{' \
              | jq -s '[.[] | select(.type == "assistant" and .message.content)] | last | .message.content[] | select(.type == "text") | .text' -r \
              > /tmp/pr-body.md
            exit 0
          fi

          TARGET_INSTRUCTION=""
          if [ -n "$TARGET_PATH" ]; then
            TARGET_INSTRUCTION="

          ## Target Request

          The user requested this path or package: $TARGET_PATH

          Start there instead of picking a target automatically."
          fi

          PROMPT="$(cat <<EOF
          # Context

          You are UI polish for the splitshare React PWA. Begin by using the \`ui-polish\` skill.

          # Scope

          Focus only on \`src/\`. You may inspect \`server/\` only when necessary to understand or validate the primary change.

          # Instructions

          1. Find high-confidence UI targets: inconsistencies, awkward spacing, broken responsive breakpoints, outdated visual patterns.
          2. Pick a small, reviewable set of changes.
          3. Use the real source of truth, not support-only examples.
          4. Avoid adjacent cleanup that belongs to another workflow.
          5. Validate with \`npm run build\`.
          6. Commit and push your changes.

          ## Validation Commands

          \`\`\`bash
          npm run build
          \`\`\`

          ## Important Rules

          - Do not touch \`server/sync-server.mjs\` or payment sync logic — those belong to a different loop.
          - Keep currency display in EGP; preserve the local-first room model.
          - You are running in a sandbox or CI runner environment. Do not stop and ask for feedback from the user or request approvals.

          ## Agent Memory

          $MEMORY_CONTENT

          ## Finishing Up

          When you are finished:
          1. Make sure the validation commands pass.
          2. Commit and push your changes.
          3. Answer with the output format below.

          ## Output Format

          Format your final answer as GitHub-flavored markdown:

          \`\`\`markdown
          ## UI Polish Complete

          ### Changes Made
          - [file/component]: [what changed and why]

          ### Source Of Truth Checked
          - [path]: [why it supports the change]

          ### Validation
          - [x] npm run build passed
          \`\`\`
          ${TARGET_INSTRUCTION}
          EOF
          )"

          claude -p "$PROMPT" \
            --permission-mode bypassPermissions \
            --output-format stream-json \
            --verbose \
            2>&1 | tee /tmp/agent-output.txt

      - name: Extract PR body
        if: steps.agent_gate.outputs.run_agent == 'true' && github.event_name != 'issue_comment'
        run: |
          # Claude Code stream-json extraction
          cat /tmp/agent-output.txt \
            | grep '^{' \
            | jq -s '[.[] | select(.type == "assistant" and .message.content)] | last | .message.content[] | select(.type == "text") | .text' -r \
            > /tmp/pr-body.md

      - name: Push and create PR
        if: steps.agent_gate.outputs.run_agent == 'true' && github.event_name != 'issue_comment'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AGENT_LABEL: agent-ui-polish
          WORKFLOW_ID: agent-ui-polish
        run: |
          if git diff --quiet origin/main...HEAD; then
            echo "No commits were created by the agent; skipping PR creation."
            exit 0
          fi

          git push --set-upstream origin "${{ env.BRANCH }}"

          # Add the hidden workflow marker to the PR body for /iterate routing.
          bun .github/scripts/agent-iteration.ts \
            --command footer \
            --workflow "$WORKFLOW_ID" \
            --memory .github/agent-memory/ui-polish.md >> /tmp/pr-body.md

          gh label create "$AGENT_LABEL" --description "Recurring UI Polish agent PR" --color "0E8A16" || true
          PR_URL=$(gh pr create --title "[$(date +%m/%d)][Agent: UI Polish]: UI improvements" --body-file /tmp/pr-body.md)
          gh pr edit "$PR_URL" --add-label "$AGENT_LABEL"

      - name: Push iteration changes and comment
        if: steps.agent_gate.outputs.run_agent == 'true' && github.event_name == 'issue_comment'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! git diff --quiet HEAD; then
            git add -A
            git commit -m "chore: iterate ui-polish agent feedback"
            git push origin HEAD:${{ steps.agent_gate.outputs.head_ref }}
          fi

          gh pr comment ${{ steps.agent_gate.outputs.number }} --body-file /tmp/pr-body.md

      - name: Upload agent output
        if: always() && steps.agent_gate.outputs.run_agent == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: agent-output
          path: /tmp/agent-output.txt
