# Production: nginx (HTTP, gzip, security headers) -> node app (dist/ + /api).
# SQLite lives in the named volume; rooms auto-expire after 48h regardless.
#
#   HTTP_PORT=8080 ALLOWED_ORIGIN=https://example.com docker compose up -d --build
#   curl localhost:8080/healthz   # {"ok":true}

services:
  app:
    build: .
    environment:
      NODE_ENV: production
      ALLOWED_ORIGIN: ${ALLOWED_ORIGIN:-https://splitshare.youssef-ayman.me}
      PORT: 3001
    volumes:
      - splitshare-data:/app/data
    expose:
      - 3001
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', "node -e \"fetch('http://127.0.0.1:3001/healthz').then(r=>{if(!r.ok)process.exit(1)})\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  nginx:
    image: nginx:1.27-alpine
    entrypoint: /entrypoint.sh
    ports:
      - ${HTTP_PORT:-80}:80
      - ${HTTPS_PORT:-443}:443
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx.http-only.conf:/etc/nginx/nginx.http-only.conf:ro
      - ./nginx-entrypoint.sh:/entrypoint.sh:ro
      - letsencrypt-certs:/etc/letsencrypt
      - certbot-webroot:/var/www/certbot
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

  # One-shot issuance (idempotent): runs on every `up`, exits when certs exist.
  # Requires DNS pointed + port 80 public. Renew via host cron, then reload nginx.
  certbot:
    image: certbot/certbot:v2.11.0
    entrypoint: /bin/sh -c 'ARGS="--register-unsafely-without-email"; [ -n "$CERTBOT_EMAIL" ] && ARGS="--email $CERTBOT_EMAIL --no-eff-email"; exec certbot certonly --webroot -w /var/www/certbot -d splitshare.youssef-ayman.me $ARGS --agree-tos --keep'
    environment:
      CERTBOT_EMAIL: ${CERTBOT_EMAIL:-}
    volumes:
      - letsencrypt-certs:/etc/letsencrypt
      - certbot-webroot:/var/www/certbot
    depends_on:
      nginx:
        condition: service_started

volumes:
  splitshare-data:
  letsencrypt-certs:
  certbot-webroot:
